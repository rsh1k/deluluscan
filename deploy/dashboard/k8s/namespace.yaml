# A dedicated namespace for the Deluluscan dashboard — deliberately separate from any
# other tenant. This deployment touches nothing outside it.
apiVersion: v1
kind: Namespace
metadata:
  name: deluluscan
  labels:
    app.kubernetes.io/provider: aws
    app.kubernetes.io/tenant: deluluscan
    app.kubernetes.io/project: security-dashboard
    app.kubernetes.io/environment: prod
