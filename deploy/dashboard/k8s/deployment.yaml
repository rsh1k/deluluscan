apiVersion: v1
kind: ServiceAccount
metadata:
  name: deluluscan-dashboard-sa
  namespace: deluluscan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluluscan-dashboard
  namespace: deluluscan
  labels:
    app: deluluscan-dashboard
    fullname: deluluscan-security-dashboard
    target.cloud/provider: aws
    target.cloud/scope: corp
    target.cloud/tenant: deluluscan
    target.cloud/project: security-dashboard
    target.cloud/environment: prod
    target.cloud/region: us-east-1
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      fullname: deluluscan-security-dashboard
  template:
    metadata:
      labels:
        app: deluluscan-dashboard
        fullname: deluluscan-security-dashboard
        target.cloud/tenant: deluluscan
        target.cloud/project: security-dashboard
        target.cloud/environment: prod
    spec:
      serviceAccountName: deluluscan-dashboard-sa
      containers:
        - name: dashboard
          # TODO: point at the ECR repo the platform team creates for this image.
          image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/deluluscan/dashboard:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx needs /var/cache; static content is read-only
            runAsNonRoot: true
