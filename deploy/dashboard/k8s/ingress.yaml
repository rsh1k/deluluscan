# ALB ingress that GATES the dashboard behind Google SSO.
#
# Unlike dotusage (which does Google OAuth inside its app), the dashboard is a
# static file with no app — so authentication is enforced at the ALB via OIDC:
# an unauthenticated request is redirected to Google login and only reaches nginx
# after a successful sign-in. This is the least-code way to put a static site
# behind real SSO.
#
# IMPORTANT: restrict the Google OAuth client to the example.com Workspace
# (set the OAuth consent screen to "Internal"). ALB OIDC by itself accepts ANY
# Google account; the Internal setting is what limits it to the target staff.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deluluscan-dashboard-alb
  namespace: deluluscan
  labels:
    target.cloud/tenant: deluluscan
    target.cloud/project: security-dashboard
    target.cloud/environment: prod
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: '3000'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type":"redirect","RedirectConfig":{"Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}'
    # TODO(platform): ACM cert for deluluscan.target.cloud (or the *.target.cloud wildcard)
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERT_ARN>"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-FS-1-2-Res-2020-10
    # OPTIONAL: same IP-allowlist SG pattern dotusage uses, for network-layer defence-in-depth.
    # alb.ingress.kubernetes.io/security-groups: "<ALB_SG_ID>"
    #
    # ---- Google SSO (OIDC) -------------------------------------------------
    alb.ingress.kubernetes.io/auth-type: oidc
    alb.ingress.kubernetes.io/auth-scope: "openid email profile"
    alb.ingress.kubernetes.io/auth-session-timeout: '3600'
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/auth-idp-oidc: |
      {
        "issuer": "https://accounts.google.com",
        "authorizationEndpoint": "https://accounts.google.com/o/oauth2/v2/auth",
        "tokenEndpoint": "https://oauth2.googleapis.com/token",
        "userInfoEndpoint": "https://openidconnect.googleapis.com/v1/userinfo",
        "secretName": "deluluscan-dashboard-oidc"
      }
spec:
  rules:
    - host: deluluscan.target.cloud      # TODO(platform): Route53 record -> this ALB
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port: { name: use-annotation }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deluluscan-dashboard-svc
                port: { number: 3000 }
