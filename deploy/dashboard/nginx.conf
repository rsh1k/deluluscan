server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # ALB health check target (see ingress healthcheck-path)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The single-file dashboard. Everything routes to it; SSO is enforced upstream
    # at the ALB (Google OIDC), so no auth logic lives here.
    location / {
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;
    }
}
