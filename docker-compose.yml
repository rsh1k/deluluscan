# Deluluscan — local target harness (bring-your-own-target).
#
# Deluluscan is a general web / API / application security auditor. It does NOT
# ship a target: point it at an app you are authorized to test. This compose
# file stands up a throwaway target on THIS host (so it is inherently in the
# loopback/RFC1918 authorization scope) plus the common backing services an app
# usually needs. Set TARGET_IMAGE to the container you want to assess, or edit
# the `target` service to match your stack, then: docker compose up -d
#
# Optional backends (Postgres + OpenSearch) are provided for apps that need
# them; delete the services you do not use.
services:
  db:
    image: pgvector/pgvector:pg18
    command: postgres -c 'max_connections=400' -c 'shared_buffers=128MB'
    environment:
      POSTGRES_USER: 'appdbuser'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'appdb'
    volumes:
      - dbdata:/var/lib/postgresql
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appdbuser -d appdb -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  search:
    image: opensearchproject/opensearch:1
    environment:
      cluster.name: "search-cluster"
      discovery.type: "single-node"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xmx1G"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - search-data:/usr/share/opensearch/data
    networks:
      - search-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  # ---- The application under test (CONFIGURE THIS) ------------------------
  # Replace TARGET_IMAGE with the app you are authorized to assess, and add the
  # environment/volumes it needs. Ports are bound to loopback only so the target
  # is reachable only from this host.
  target:
    image: "${TARGET_IMAGE:-your-app:latest}"
    environment:
      APP_DB_URL: "jdbc:postgresql://db/appdb"
      APP_DB_USER: 'appdbuser'
      APP_DB_PASSWORD: 'password'
      APP_SEARCH_ENDPOINT: 'http://search:9200'
    depends_on:
      - db
      - search
    volumes:
      - app-shared:/data/shared
    networks:
      - db_net
      - search-net
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"

networks:
  db_net:
  search-net:

volumes:
  app-shared:
  dbdata:
  search-data:
