name: Deploy dashboard (SSO)

# OPTIONAL, self-hosted deployment example: rebuild the Deluluscan dashboard image,
# push it to Amazon ECR, and roll an EKS deployment (see deploy/dashboard/). This is
# a template for teams who host the dashboard on their own AWS account — it is fully
# parameterised by the repo variables below and authenticates via GitHub OIDC (no
# stored AWS keys). It ships disabled and is not required to use Deluluscan.
#
# workflow_dispatch + workflow_call only (no schedule), and the job is a no-op until
# AWS_DEPLOY_ROLE_ARN is set, so an unconfigured fork never runs a doomed job. Adapt
# the steps to your own registry/orchestrator if you don't use ECR/EKS.
#
# Required repo variables (Settings -> Secrets and variables -> Actions -> Variables),
# pointing at your OWN AWS account (an IAM role whose trust policy allows this repo,
# an ECR repository, and EKS access):
#   AWS_DEPLOY_ROLE_ARN  e.g. arn:aws:iam::<acct>:role/deluluscan-github-actions
#   ECR_DASHBOARD_REPO   e.g. <acct>.dkr.ecr.us-east-1.amazonaws.com/deluluscan/dashboard
#   EKS_CLUSTER_NAME     your cluster name (for aws eks update-kubeconfig)
#   AWS_REGION           optional; defaults to us-east-1

on:
  workflow_dispatch:
    inputs:
      results_path:
        description: "Path to the scan results.json to render"
        default: "deluluscan-out/results.json"
        required: false
  workflow_call:
    inputs:
      results_path:
        type: string
        default: "deluluscan-out/results.json"
        required: false

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # No-op until the deploy role is configured, so an unconfigured fork never
    # runs a doomed job.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    permissions:
      id-token: write        # OIDC -> AWS STS
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      RESULTS: ${{ inputs.results_path || 'deluluscan-out/results.json' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Deluluscan deps
        run: pip install -r requirements.txt

      - name: Generate the dashboard (plaintext — SSO is the boundary)
        run: |
          test -f "$RESULTS" || { echo "results not found: $RESULTS"; exit 1; }
          python3 -m deluluscan.dashboard "$RESULTS" deploy/dashboard/dashboard.html

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dashboard
          file: deploy/dashboard/Dockerfile
          push: true
          tags: |
            ${{ vars.ECR_DASHBOARD_REPO }}:latest
            ${{ vars.ECR_DASHBOARD_REPO }}:${{ github.sha }}

      - name: Roll the EKS deployment
        run: |
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "$AWS_REGION"
          kubectl -n deluluscan set image deployment/deluluscan-dashboard \
            dashboard="${{ vars.ECR_DASHBOARD_REPO }}:${{ github.sha }}"
          kubectl -n deluluscan rollout status deployment/deluluscan-dashboard --timeout=120s
